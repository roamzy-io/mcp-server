# Dependabot configuration for @roamzy/mcp-server
#
# Watches npm devDependencies (the runtime bundle has zero deps — esbuild
# inlines everything) and the GitHub Actions ecosystem.
#
# Cadence: weekly on Mondays. The repo has small surface area; weekly is
# enough to catch security advisories without PR noise.

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "automerge-candidate"
    commit-message:
      prefix: "deps"
      include: "scope"
    # Group all minor + patch bumps into one PR per week to reduce noise.
    # Major bumps still land as separate PRs (more careful review needed).
    groups:
      dev-deps-minor:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    labels:
      - "ci"
    commit-message:
      prefix: "ci"
