# Auto-reminder for NPM_TOKEN rotation.
#
# Runs daily. Checks if we're within 7 days of `NPM_TOKEN_EXPIRES_AT`
# (a repository variable, not a secret — it's just a date). If yes,
# files a "rotate token soon" issue tagged `token-rotation`. Idempotent:
# only files one open issue per cycle (won't spam if there's already one
# open with the same tag).
#
# Why this exists: npm's granular tokens cap at 90 days. Manual cron
# in a calendar app gets forgotten. A workflow in the repo can't be
# forgotten — it lives where the rotation happens.
#
# When you rotate the token, also update the repo variable
# `NPM_TOKEN_EXPIRES_AT` to the new expiration date (Settings →
# Secrets and variables → Actions → Variables tab → update).

name: NPM_TOKEN rotation reminder

on:
  schedule:
    # Daily at 09:00 UTC — outside peak hours, before most workdays start.
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  issues: write

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Check expiration and file issue if due
        uses: actions/github-script@v8
        env:
          # The expiration date the operator picked when generating the
          # current NPM_TOKEN. Update this when rotating.
          # Default (if variable unset) is 2026-08-20 — the initial token's
          # expiration date.
          EXPIRES_AT: ${{ vars.NPM_TOKEN_EXPIRES_AT || '2026-08-20' }}
          REMIND_DAYS_BEFORE: '7'
        with:
          script: |
            const expiresAt = new Date(process.env.EXPIRES_AT);
            const remindDaysBefore = parseInt(process.env.REMIND_DAYS_BEFORE, 10);
            const now = new Date();

            const msPerDay = 24 * 60 * 60 * 1000;
            const daysUntilExpiry = Math.ceil((expiresAt - now) / msPerDay);

            console.log(`Token expires ${expiresAt.toISOString().slice(0,10)} (${daysUntilExpiry} days from now). Remind if ≤ ${remindDaysBefore} days.`);

            if (daysUntilExpiry > remindDaysBefore) {
              console.log('Not yet time to remind. Skipping.');
              return;
            }

            // Idempotency: don't file another issue if one is already open
            // with the same label and the urgent prefix.
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'token-rotation',
            });
            const urgentTitle = `⏰ NPM_TOKEN expires in ${daysUntilExpiry} day(s) — rotate now`;
            const alreadyFiled = existing.some(i => i.title.startsWith('⏰ NPM_TOKEN expires in'));
            if (alreadyFiled) {
              console.log('Urgent reminder issue already open. Skipping.');
              return;
            }

            const body = [
              `⏰ The \`NPM_TOKEN\` secret will expire on **${expiresAt.toISOString().slice(0,10)}** (${daysUntilExpiry} days from now).`,
              '',
              `After expiration, every \`git push --tags v*\` will fail at the \`npm publish\` step.`,
              '',
              '## Rotation procedure (~3 minutes)',
              '',
              '1. Revoke the old token at https://www.npmjs.com/settings/artur-mamontov/tokens',
              '2. Generate a new granular token at https://www.npmjs.com/settings/artur-mamontov/tokens/granular-access-tokens/new with:',
              '   - Name: `github-actions-mcp-server-release`',
              '   - Expiration: 90 days (max)',
              '   - Packages and scopes → Read and write → `@roamzy` scope',
              '   - Organizations → Read → `roamzy` org',
              '3. Update the secret at https://github.com/roamzy-io/mcp-server/settings/secrets/actions/NPM_TOKEN',
              '4. **Important:** also update the repo variable `NPM_TOKEN_EXPIRES_AT` (Settings → Secrets and variables → Actions → Variables tab) to the new expiration date so this workflow stays accurate.',
              '5. Close this issue.',
              '',
              'See the original rotation runbook in #6 for full context.',
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: urgentTitle,
              body,
              labels: ['token-rotation'],
            });
            console.log('Reminder issue filed.');
