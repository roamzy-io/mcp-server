# Auto-release workflow for @roamzy/mcp-server.
#
# Trigger: a push of a git tag matching `v*` (e.g. `git tag v1.5.3 && git push --tags`).
# Steps:
#   1. Check out the source at the tagged commit.
#   2. Install Node 20.x.
#   3. `pnpm install` (frozen lockfile — fails if package-lock drifts).
#   4. `pnpm run build` (runs esbuild to produce dist/index.js).
#   5. Sanity-test the bundle (npx-style invocation, smoke-test MCP handshake).
#   6. `npm publish --access public` to the npm registry, authenticated by OIDC.
#   7. Create a draft GitHub release (operator manually publishes once happy).
#
# Required repo secrets: NONE.
#
# Publishing is authenticated by npm Trusted Publishing (OIDC), configured on
# the package at npmjs.com against this repository and this filename. GitHub
# mints a short-lived identity token per run; npm verifies it and accepts the
# publish. There is no long-lived credential anywhere in this pipeline — nothing
# to leak, rotate, or steal. The `NPM_TOKEN` secret this workflow used until
# 2026-08-06 is gone, and the package is set to refuse token publishes outright.
#
# Why this changed: the security audit of 2026-08-06 named long-lived tokens as
# one of the conditions that turn a prompt injection into a supply-chain
# compromise. This package has ~491 weekly installs; a stolen publishing token
# would have reached every one of them, with no model in the loop to object.
# Rotating the token addressed the symptom. Removing it addresses the class.
#
# Provenance is automatic under Trusted Publishing — the published package still
# carries a signed link back to this exact commit and run, verifiable with
# `npm view @roamzy/mcp-server provenance`. The explicit `--provenance` flag is
# therefore no longer passed; OIDC implies it.
#
# To use:
#   git tag v1.5.3
#   git push origin v1.5.3
# That triggers this workflow; no further operator action needed at publish time.

name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    name: Publish to npm + GitHub Release
    runs-on: ubuntu-latest

    # OIDC token for npm --provenance attestation. id-token: write is required.
    permissions:
      contents: write     # create GitHub Release
      id-token: write     # npm provenance attestation

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install Node.js 20.x
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Upgrade npm to a version that can publish over OIDC
        # Node 20 ships npm 10.x; Trusted Publishing landed in npm 11.5.1. The
        # major is pinned deliberately: `npm@latest` is now 12.x, which requires
        # Node >= 22.22 and dies with EBADENGINE on this runner. That is exactly
        # how the first attempt at this release failed (run 31106958055), and
        # the error names the engine, not the auth — easy to misread as OIDC
        # being broken when it had not yet been reached.
        #
        # Raise this to `npm@12` only together with the Node version above.
        run: npm install -g npm@^11 && npm --version

      - name: Install dependencies (strict, from lockfile)
        # `npm ci` is the strict, reproducible variant of `npm install`. It:
        #   - refuses to start if package.json and package-lock.json diverge
        #   - wipes node_modules before install (no stale state)
        #   - never updates the lockfile during install
        # This guarantees CI builds use the exact dep tree captured in
        # package-lock.json — no transitive drift between runs.
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        # `tsc --noEmit` validates against tsconfig.json (strict mode, with
        # types:["node"] for the process globals). esbuild itself doesn't
        # typecheck, so this is the only place we catch TS errors before
        # publish.
        run: npx tsc --noEmit

      - name: Install snippet is stated once, not twice
        # `.mcp.json` (for Open Plugins scanners) and the README block (for humans)
        # carry the same object. Two copies of one fact rot quietly, so assert they
        # still agree before anything ships.
        run: npm run check:install-config

      - name: Tag must match the version being published
        # The tag IS the trigger, and nothing else ties it to package.json. A tag
        # cut before the version bump was committed would build the PREVIOUS tree
        # and hand npm a version it already has — E403, mid-release. Cheaper to
        # refuse here than to diagnose it from a red run.
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          SRV=$(node -p "require('./server.json').version")
          SRVPKG=$(node -p "require('./server.json').packages[0].version")
          echo "tag=$TAG package.json=$PKG server.json=$SRV/$SRVPKG"
          for V in "$PKG" "$SRV" "$SRVPKG"; do
            if [ "$V" != "$TAG" ]; then
              echo "✗ version mismatch: tag says $TAG, a manifest says $V"
              exit 1
            fi
          done
          echo "✓ tag and all manifests agree on $TAG"

      - name: Build
        run: npm run build

      - name: Smoke-test the bundle
        run: |
          # Verify the server responds to an MCP initialize handshake AND
          # reports the full tool list. Any failure aborts the release before
          # npm publish.
          set -euo pipefail
          OUTPUT=$(printf '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci-smoke","version":"1"}}}\n{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}\n' \
            | timeout 5 node dist/index.js)
          echo "$OUTPUT" | grep -q '"name":"roamzy"' && echo "✓ MCP handshake OK"
          TOOL_COUNT=$(echo "$OUTPUT" | python3 -c "import sys,json; ls=[json.loads(l) for l in sys.stdin if l.strip()]; tl=[d for d in ls if d.get('id')==2][0]; print(len(tl['result']['tools']))")
          if [ "$TOOL_COUNT" -lt 12 ]; then
            echo "✗ Expected at least 12 tools, got $TOOL_COUNT"
            exit 1
          fi
          echo "✓ tools/list returned $TOOL_COUNT tools"

      - name: Security audit (block on high+ severity)
        # `npm audit` against the lockfile. Blocks publish only on HIGH or
        # CRITICAL vulnerabilities. Moderate / low go through (we'll see
        # them in Dependabot PRs without blocking releases).
        run: npm audit --audit-level=high --omit=dev

      - name: Publish to npm (OIDC, no token)
        # No `env:` block by design. `id-token: write` above is what authenticates
        # this step; adding NODE_AUTH_TOKEN back would reintroduce the credential
        # this change exists to delete.
        run: npm publish --access public

      - name: Create draft GitHub release
        uses: softprops/action-gh-release@v3
        with:
          draft: true                            # operator reviews + publishes manually
          generate_release_notes: true           # auto-generates from commits since last tag
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
